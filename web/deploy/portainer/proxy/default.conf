# Reconsultar o DNS do Docker quando os contêineres forem recriados.
resolver 127.0.0.11 valid=10s ipv6=off;
upstream clube_app {
    zone clube_app 64k;
    server sistema-clube:3000 resolve;
}
upstream clube_realtime {
    zone clube_realtime 64k;
    server api-gw:8000 resolve;
}
server {
    listen 8080;
    client_max_body_size 20m;
    location = /proxy-health { access_log off; return 200 'ok'; }
    location /supabase/realtime/v1/ {
        proxy_pass http://clube_realtime/realtime/v1/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
    location / {
        proxy_pass http://clube_app;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
