map $http_x_forwarded_proto $clube_proto { default $scheme; https https; }
server {
 listen 8080;
 absolute_redirect off;
 server_name _;
 resolver 127.0.0.11 valid=10s;
 set $app http://sistema-clube:3000;
 client_max_body_size 32k;
 proxy_set_header Host $http_host;
 proxy_set_header X-Forwarded-Proto $clube_proto;
 proxy_set_header X-Forwarded-For $remote_addr;
 location = / { return 302 /associado; }
 location = /associado { proxy_set_header X-Middleware-Subrequest ""; proxy_pass $app; }
 location /associado/ { proxy_set_header X-Middleware-Subrequest ""; proxy_pass $app; }
 location /_next/static/ { proxy_set_header X-Middleware-Subrequest ""; proxy_pass $app; }
 location = /api/associado-app { proxy_set_header X-Middleware-Subrequest ""; proxy_pass $app; }
 location = /api/associado-app/auth { proxy_set_header X-Middleware-Subrequest ""; proxy_pass $app; }
 location / { return 404; }
}
